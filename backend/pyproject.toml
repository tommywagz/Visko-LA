[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "visko-la-backend"
version = "1.0.0"
description = "Visko-LA Synthetic Aerial World & Telemetry Platform Backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.0.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
    "Pillow>=10.0.0",
    "reactor-sdk>=0.1.0",
    "google-cloud-storage>=2.14.0",
    "google-cloud-bigquery>=3.17.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
